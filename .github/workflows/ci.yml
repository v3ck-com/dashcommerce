name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / EmDash 0.41
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Unit and integration tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Native host contracts and HTTP checks
        run: bun run test:host
      - name: Paystack HTTP lifecycle (synthetic data, blocked outbound network)
        run: bun run test:http
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Browser journey
        run: bun run test:browser
      - name: Production dependency audit
        run: bun audit --production
